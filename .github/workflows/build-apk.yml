name: Build Android APK

on:
  # Build and attach an APK to a GitHub Release by pushing a tag like v1.0.1
  push:
    tags: ['v*']
  # Or build on demand from the Actions tab; the APK is saved as a run artifact
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: node --test tests/cribbage.test.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        run: |
          HTML_VER=$(grep -oP "const APP_VERSION='\K[^']+" cribbage.html)
          JSON_VER=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VER" != "$HTML_VER" || "$TAG_VER" != "$JSON_VER" ]]; then
              echo "::error::Version mismatch: tag=$TAG_VER, APP_VERSION in cribbage.html=$HTML_VER, version.json=$JSON_VER. Make all three match before tagging."
              exit 1
            fi
          fi
          echo "name=$HTML_VER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up signing key (if secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set. The APK will be signed with a throwaway debug key and cannot be installed over a previous build. See README."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle assembleRelease --no-daemon
          -PappVersion=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ github.run_number }}

      - name: Name the APK
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OrangitazCribbage-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OrangitazCribbage-apk
          path: dist/*.apk

      - name: Write release notes from version.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 -c "import json;print(json.load(open('version.json'))['notes'])" > RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: RELEASE_NOTES.md
